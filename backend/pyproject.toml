[project]
name = "interview-simulator"
version = "0.1.0"
description = "CareerSwiftr - AI Interview Simulator for software engineers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Bogdan Veliscu", email = "bogdan@codeswiftr.com" }
]
keywords = ["interview", "ai", "simulator", "coaching", "fastapi"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1.19",
    "greenlet>=3.0.3",
    "redis>=5.2.0",
    "anthropic>=0.37.0",
    "openai>=1.50.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "stripe>=14.0.1",
    "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N806"]  # Allow PascalCase Mock variable names in tests (common pattern)
"alembic/env.py" = ["E402"]  # Module imports not at top (required for Alembic)

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]
