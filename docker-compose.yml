# Interview Simulator - Local Development Services
# Usage: docker compose up -d
#
# Redis removed in Phase 1.1 (Rails 8 adoption plan).
# Rate limiting now uses PostgreSQL; ConversionTracker runs without persistence.

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-simulator-postgres
    environment:
      POSTGRES_DB: interview_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_simulator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
